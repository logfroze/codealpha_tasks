<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha Calculator</title>
    <meta name="description" content="A modern, responsive vanilla JavaScript calculator featuring arithmetic operations, keyboard support, decimal handling, history, and a human-crafted design." />
    <meta property="og:title" content="CodeAlpha Calculator" />
    <meta property="og:description" content="A modern, responsive vanilla JavaScript calculator featuring arithmetic operations, keyboard support, decimal handling, history, and a human-crafted design." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Modern Geometric & Digit Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-wrapper">
      <!-- Top Screen Header (Outside Calculator Frame) -->
      <header class="page-top-header" id="page-top-header">
        <h1 class="task-title" id="task-title">CodeAlpha - FrontEnd - Task 02</h1>
      </header>

      <div class="calculator" id="calculator-app">
        <!-- Calculator Top Header & Controls -->
        <header class="calc-header" id="calc-header">
          <div class="brand-info">
            <h2 class="brand-title">CodeAlpha</h2>
            <span class="brand-badge">Calculator</span>
          </div>

          <div class="header-actions" role="toolbar" aria-label="Calculator tools">
            <!-- Sound Toggle Button -->
            <button
              type="button"
              class="icon-btn"
              id="btn-sound-toggle"
              aria-label="Enable sound"
              title="Toggle tactile click sounds"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <line x1="22" x2="16" y1="9" y2="15"/>
                <line x1="16" x2="22" y1="9" y2="15"/>
              </svg>
            </button>

            <!-- History Toggle Button -->
            <button
              type="button"
              class="icon-btn"
              id="btn-history-toggle"
              aria-label="Calculation history"
              aria-expanded="false"
              title="View calculation history"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              <span class="history-count-badge" id="history-count" style="display: none;">0</span>
            </button>

            <!-- Light / Dark Theme Toggle Button -->
            <button
              type="button"
              class="icon-btn"
              id="btn-theme-toggle"
              aria-label="Switch theme"
              title="Toggle dark/light theme"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/>
                <path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/>
                <path d="m19.07 4.93-1.41 1.41"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Calculation History Drawer -->
        <section class="history-drawer" id="history-drawer" aria-label="Calculation history drawer">
          <div class="history-header">
            <span class="history-title">Recent Calculations</span>
            <button type="button" class="clear-history-btn" id="btn-clear-history">Clear History</button>
          </div>
          <div class="history-list" id="history-list" role="list">
            <div class="history-empty">No calculations yet</div>
          </div>
        </section>

        <!-- Calculator Tactile LCD Display Area -->
        <section class="display-wrapper" id="calculator-display" aria-label="Calculator display">
          <div class="display-top-row">
            <button type="button" class="copy-btn" id="btn-copy" aria-label="Copy result" title="Copy to clipboard">
              <span class="copy-icon" aria-hidden="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </span>
              <span class="copy-tooltip">Copied!</span>
            </button>
            <div class="secondary-display" id="secondary-display" aria-live="polite" aria-atomic="true"></div>
          </div>
          <div class="primary-display-container">
            <div class="primary-display" id="primary-display" role="status" aria-live="polite" aria-atomic="true">0</div>
          </div>
        </section>

        <!-- Keypad Grid -->
        <div class="keypad" id="keypad" role="grid" aria-label="Calculator keypad">
          <!-- Row 1: Utility & Division -->
          <button type="button" class="btn btn-func btn-clear" id="btn-clear" data-action="clear" aria-label="Clear all">C</button>
          <button type="button" class="btn btn-func" id="btn-delete" data-action="delete" aria-label="Delete last digit">DEL</button>
          <button type="button" class="btn btn-func" id="btn-percent" data-action="percent" aria-label="Percent">%</button>
          <button type="button" class="btn btn-op" id="btn-divide" data-operator="/" aria-label="Divide">÷</button>

          <!-- Row 2: 7, 8, 9, Multiply -->
          <button type="button" class="btn btn-num" id="btn-7" data-number="7">7</button>
          <button type="button" class="btn btn-num" id="btn-8" data-number="8">8</button>
          <button type="button" class="btn btn-num" id="btn-9" data-number="9">9</button>
          <button type="button" class="btn btn-op" id="btn-multiply" data-operator="*" aria-label="Multiply">×</button>

          <!-- Row 3: 4, 5, 6, Subtract -->
          <button type="button" class="btn btn-num" id="btn-4" data-number="4">4</button>
          <button type="button" class="btn btn-num" id="btn-5" data-number="5">5</button>
          <button type="button" class="btn btn-num" id="btn-6" data-number="6">6</button>
          <button type="button" class="btn btn-op" id="btn-subtract" data-operator="-" aria-label="Subtract">−</button>

          <!-- Row 4: 1, 2, 3, Add -->
          <button type="button" class="btn btn-num" id="btn-1" data-number="1">1</button>
          <button type="button" class="btn btn-num" id="btn-2" data-number="2">2</button>
          <button type="button" class="btn btn-num" id="btn-3" data-number="3">3</button>
          <button type="button" class="btn btn-op" id="btn-add" data-operator="+" aria-label="Add">+</button>

          <!-- Row 5: Plus/Minus, 0, Decimal, Equals -->
          <button type="button" class="btn btn-func" id="btn-negate" data-action="negate" aria-label="Toggle sign">±</button>
          <button type="button" class="btn btn-num" id="btn-0" data-number="0">0</button>
          <button type="button" class="btn btn-num" id="btn-decimal" data-action="decimal" aria-label="Decimal point">.</button>
          <button type="button" class="btn btn-eq" id="btn-equals" data-action="calculate" aria-label="Equals">=</button>
        </div>
      </div>

      <!-- External Portfolio Subtitle -->
      <footer class="external-footer" id="external-footer">
        <p><strong>CodeAlpha</strong> Frontend Development Internship</p>
        <p>HTML5 • CSS3 • Vanilla JavaScript</p>
      </footer>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
