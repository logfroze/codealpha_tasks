  <text x="300" y="505" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#6ee7b7" text-anchor="middle" letter-spacing="3">ANTONIO VIVALDI • VIOLIN</text>
  <rect x="24" y="24" width="552" height="552" stroke="#34d399" stroke-width="1" fill="none" opacity="0.35"/>
