  <path d="M160 490 Q 300 480 440 490" stroke="#c7d2fe" stroke-width="1" fill="none" opacity="0.2"/>
  <!-- Typography -->
  <text x="300" y="540" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="4">CLAIR DE LUNE</text>
  <text x="300" y="568" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CLAUDE DEBUSSY</text>
  <rect x="20" y="20" width="560" height="560" stroke="#475569" stroke-width="1" fill="none" opacity="0.35"/>
